AWSTemplateFormatVersion: '2010-09-09'

Description: BusGo infrastructure - ECR and RDS

Resources:

  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: busgo-backend
      ImageScanningConfiguration:
        ScanOnPush: false
      ImageTagMutability: MUTABLE

  FrontendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: busgo-frontend
      ImageScanningConfiguration:
        ScanOnPush: false
      ImageTagMutability: MUTABLE

  BusGoDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DBInstanceIdentifier: busgo-postgres
      DBInstanceClass: db.t3.micro
      Engine: postgres
      EngineVersion: '17.9'
      DBName: bus_booking_db
      MasterUsername: postgres
      AllocatedStorage: 20
      StorageType: gp3
      MultiAZ: false
      PubliclyAccessible: false
      DBSubnetGroupName: busgo-rds-subnet-group
      VPCSecurityGroups:
        - sg-0bec079ddbf5c733d
      DeletionProtection: false
      AutoMinorVersionUpgrade: true